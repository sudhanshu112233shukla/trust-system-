[package]
name = "trust_router"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
md5 = "0.8.1"
opentelemetry = "0.32.0"
opentelemetry-stdout = "0.32.0"
opentelemetry_sdk = "0.32.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
proptest = "1.11.0"
